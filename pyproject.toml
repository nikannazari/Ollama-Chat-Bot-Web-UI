[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "chat-bot"
version = "1.0.0"
description = "A local AI chatbot powered by Ollama and Streamlit."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "streamlit>=1.40,<2.0",
    "requests>=2.32,<3.0",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]